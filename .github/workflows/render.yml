name: 3loom render — علوم بلهجتنا (FFmpeg montage; no publish, no spend)

# Dispatched by n8n workflow «علوم بلهجتنا — 3. إنتاج الفيديو».
# Input job file: jobs/<job_id>.json on main (written by n8n, deleted here after use).
# Output: <job_id>.mp4 attached to the pre-release "3loom-renders"; result POSTed to the n8n Wait node.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job file name (without .json) under jobs/"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: 3loom-render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: 3loom-renders
      OUT: /tmp/3loom-out
      JOB_FILE: /tmp/3loom-job.json
    steps:
      - uses: actions/checkout@v4

      - name: Validate job id and fetch job file
        run: |
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || { echo "bad job_id"; exit 1; }
          cp "jobs/${JOB_ID}.json" "$JOB_FILE"
          python3 render/run_job.py mask "$JOB_FILE"

      - name: Install ffmpeg, Arabic fonts and Pillow (raqm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-core fontconfig libfribidi0 libharfbuzz0b >/dev/null
          fc-cache -f >/dev/null
          python3 -m pip install --quiet pillow==11.1.0
          python3 -c "from PIL import features; assert features.check('raqm'), 'raqm missing'"

      - name: Render
        run: python3 render/run_job.py render "$JOB_FILE" "$OUT"

      - name: Attach video to release
        id: upload
        if: success()
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --prerelease \
            --title "3loom renders (drafts for review, not published)" \
            --notes "Temporary review copies produced by n8n. Assets older than 14 days are removed automatically."
          gh release upload "$RELEASE_TAG" "$OUT/${JOB_ID}.mp4" --clobber
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name==\"${JOB_ID}.mp4\") | .id")
          echo "asset_id=$id" >> "$GITHUB_OUTPUT"

      - name: Report result to n8n
        if: always()
        env:
          ASSET_ID: ${{ steps.upload.outputs.asset_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$JOB_FILE" ] || { echo "no job file; cannot call back"; exit 1; }
          python3 render/run_job.py callback "$JOB_FILE" "$OUT"

      - name: Delete job file and prune old renders
        if: always()
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/jobs/${JOB_ID}.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/contents/jobs/${JOB_ID}.json" \
              -f message="3loom: remove consumed job ${JOB_ID}" -f sha="$sha" -f branch=main >/dev/null
          fi
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq ".assets[] | select(.created_at < \"$cutoff\") | .id" 2>/dev/null | while read -r aid; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$aid" || true
            done
